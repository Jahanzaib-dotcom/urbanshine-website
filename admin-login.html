<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Security Gateway | Urban Shine Perth</title>
  <link rel="icon" type="image/png" href="/assets/images/logo-emblem.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070913;
      --card-bg: #0E1225;
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: #161B33;
      --input-border: #262D52;
      --primary: #EF4444;
      --primary-hover: #DC2626;
      --accent-orange: #F78614;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --text-subtle: #64748B;
      --success: #10B981;
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(247, 134, 20, 0.1) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.6) 0px, transparent 100%);
      font-family: var(--font-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }

    .auth-logo-badge img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .auth-title {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .auth-title span {
      color: var(--primary);
    }

    .auth-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent-orange));
    }

    /* Tab Switcher */
    .auth-tabs {
      display: flex;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 10px 14px;
      background: none;
      border: none;
      border-radius: 8px;
      color: var(--text-muted);
      font-family: var(--font-main);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .auth-tab-btn.active {
      background: var(--card-bg);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .auth-tab-btn:hover:not(.active) {
      color: #FFFFFF;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-subtle);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 12px 14px 12px 42px;
      font-family: var(--font-main);
      font-size: 0.92rem;
      color: #FFFFFF;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
      background: #1B213F;
    }

    .form-input::placeholder {
      color: var(--text-subtle);
    }

    .toggle-pass-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-subtle);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .toggle-pass-btn:hover {
      color: #FFFFFF;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      font-size: 0.82rem;
    }

    .remember-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .remember-wrapper input[type="checkbox"] {
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 13px 20px;
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-family: var(--font-main);
      font-size: 0.94rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.3);
    }

    .btn-submit:hover {
      background: var(--primary-hover);
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.45);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* Alert Banner */
    .auth-alert {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 500;
      margin-bottom: 20px;
      align-items: center;
      gap: 8px;
    }

    .auth-alert.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #FCA5A5;
    }

    .auth-alert.success {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6EE7B7;
    }

    .credential-hint {
      margin-top: 20px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    .credential-hint strong {
      color: #FFFFFF;
      font-family: monospace;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
    }

    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.84rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-home-link:hover {
      color: #FFFFFF;
    }

    /* Shake animation on invalid attempt */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .shake {
      animation: shake 0.35s ease-in-out;
    }

    /* Mobile Responsiveness for Login Portal */
    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
        justify-content: flex-start;
      }
      .auth-container {
        margin-top: 10px;
      }
      .auth-header {
        margin-bottom: 20px;
      }
      .auth-logo-badge {
        width: 54px;
        height: 54px;
        border-radius: 14px;
        margin-bottom: 12px;
      }
      .auth-logo-badge img {
        width: 32px;
        height: 32px;
      }
      .auth-title {
        font-size: 1.45rem;
      }
      .auth-subtitle {
        font-size: 0.8rem;
      }
      .auth-card {
        padding: 22px 16px;
        border-radius: 16px;
      }
      .form-input {
        padding: 13px 14px 13px 40px;
        font-size: 16px !important; /* Prevents iOS Safari auto-zoom */
      }
      .btn-submit {
        padding: 14px 16px;
        font-size: 0.92rem;
      }
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo-badge">
        <img src="/assets/images/logo-emblem.png" alt="Urban Shine Emblem">
      </div>
      <h1 class="auth-title">Urban Shine <span>Admin</span></h1>
      <p class="auth-subtitle">Operations & Dispatch Management Gateway</p>
    </div>

    <div class="auth-card" id="authCard">
      <!-- Tabs -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tabBtnSignIn" onclick="switchAuthTab('signin')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
          Sign In
        </button>
        <button type="button" class="auth-tab-btn" id="tabBtnSignUp" onclick="switchAuthTab('signup')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          Sign Up
        </button>
      </div>

      <!-- Alert Notification Banner -->
      <div class="auth-alert" id="authAlert"></div>

      <!-- SIGN IN FORM -->
      <form id="signInForm" onsubmit="handleSignIn(event)">
        <div class="form-group">
          <label class="form-label" for="signInUsername">Admin Username</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </span>
            <input type="text" id="signInUsername" class="form-input" placeholder="admin" required autofocus autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signInPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </span>
            <input type="password" id="signInPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility('signInPassword', this)" title="Show/Hide Password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-wrapper">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember this device</span>
          </label>
        </div>

        <button type="submit" class="btn-submit" id="btnSignInSubmit">
          <span>Sign In to Admin Panel</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>

        <div class="credential-hint">
          Security Access: <strong>admin</strong> / <strong>123</strong>
        </div>
      </form>

      <!-- SIGN UP FORM -->
      <form id="signUpForm" onsubmit="handleSignUp(event)" style="display:none;">
        <div class="form-group">
          <label class="form-label" for="signUpFullName">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </span>
            <input type="text" id="signUpFullName" class="form-input" placeholder="e.g. Operations Manager" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signUpUsername">New Admin Username</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            </span>
            <input type="text" id="signUpUsername" class="form-input" placeholder="e.g. jahanzaib" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signUpPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </span>
            <input type="password" id="signUpPassword" class="form-input" placeholder="Create password" required autocomplete="new-password">
            <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility('signUpPassword', this)" title="Show/Hide Password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signUpRole">Administrative Role</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            </span>
            <select id="signUpRole" class="form-input" style="appearance:none; -webkit-appearance:none;">
              <option value="Senior Operations Dispatcher">Senior Operations Dispatcher</option>
              <option value="Fleet Manager">Fleet Manager</option>
              <option value="General Administrator" selected>General Administrator</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btnSignUpSubmit">
          <span>Create Admin Account & Log In</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>
    </div>

    <div class="auth-footer">
      <a href="/" class="back-home-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Urban Shine Website
      </a>
    </div>
  </div>

  <script>
    // Registered accounts store in localStorage
    const USERS_STORAGE_KEY = 'urbanshine_admin_users';

    // If already authenticated, redirect straight to dashboard
    if (sessionStorage.getItem('urbanshine_admin_authenticated') === 'true' || localStorage.getItem('urbanshine_admin_authenticated') === 'true') {
      window.location.replace('/admin');
    }

    function switchAuthTab(mode) {
      const tabSignIn = document.getElementById('tabBtnSignIn');
      const tabSignUp = document.getElementById('tabBtnSignUp');
      const formSignIn = document.getElementById('signInForm');
      const formSignUp = document.getElementById('signUpForm');
      hideAlert();

      if (mode === 'signin') {
        tabSignIn.classList.add('active');
        tabSignUp.classList.remove('active');
        formSignIn.style.display = 'block';
        formSignUp.style.display = 'none';
        document.getElementById('signInUsername').focus();
      } else {
        tabSignUp.classList.add('active');
        tabSignIn.classList.remove('active');
        formSignIn.style.display = 'none';
        formSignUp.style.display = 'block';
        document.getElementById('signUpFullName').focus();
      }
    }

    function togglePasswordVisibility(fieldId, btn) {
      const field = document.getElementById(fieldId);
      if (!field) return;
      if (field.type === 'password') {
        field.type = 'text';
        btn.style.color = '#EF4444';
      } else {
        field.type = 'password';
        btn.style.color = 'var(--text-subtle)';
      }
    }

    function showAlert(msg, isError = true) {
      const alert = document.getElementById('authAlert');
      const card = document.getElementById('authCard');
      alert.textContent = msg;
      alert.className = 'auth-alert ' + (isError ? 'error' : 'success');
      alert.style.display = 'flex';

      if (isError) {
        card.classList.remove('shake');
        void card.offsetWidth; // trigger reflow
        card.classList.add('shake');
      }
    }

    function hideAlert() {
      const alert = document.getElementById('authAlert');
      alert.style.display = 'none';
    }

    function handleSignIn(e) {
      e.preventDefault();
      hideAlert();

      const user = document.getElementById('signInUsername').value.trim();
      const pass = document.getElementById('signInPassword').value.trim();
      const remember = document.getElementById('rememberMe').checked;

      // Accepted default admin credentials
      // Username: 'admin'
      // Password: '123' (or 'admin123' or 'admin 123')
      const isDefaultAdmin = 
        user.toLowerCase() === 'admin' && 
        (pass === '123' || pass === 'admin123' || pass === 'admin 123');

      // Check custom registered users
      let customUsers = [];
      try {
        customUsers = JSON.parse(localStorage.getItem(USERS_STORAGE_KEY) || '[]');
      } catch (err) {
        customUsers = [];
      }

      const matchedCustomUser = customUsers.find(
        u => u.username.toLowerCase() === user.toLowerCase() && u.password === pass
      );

      if (isDefaultAdmin || matchedCustomUser) {
        const adminProfile = matchedCustomUser || {
          username: 'admin',
          name: 'Operations Manager',
          role: 'Super Administrator'
        };

        // Save session
        sessionStorage.setItem('urbanshine_admin_authenticated', 'true');
        sessionStorage.setItem('urbanshine_admin_user', JSON.stringify(adminProfile));

        if (remember) {
          localStorage.setItem('urbanshine_admin_authenticated', 'true');
          localStorage.setItem('urbanshine_admin_user', JSON.stringify(adminProfile));
        }

        showAlert('Authenticated successfully. Redirecting to dispatch dashboard...', false);
        setTimeout(() => {
          window.location.replace('/admin');
        }, 400);
      } else {
        showAlert('Invalid username or password. Default access: admin / 123', true);
      }
    }

    function handleSignUp(e) {
      e.preventDefault();
      hideAlert();

      const fullName = document.getElementById('signUpFullName').value.trim();
      const user = document.getElementById('signUpUsername').value.trim();
      const pass = document.getElementById('signUpPassword').value.trim();
      const role = document.getElementById('signUpRole').value;

      if (!fullName || !user || !pass) {
        showAlert('Please complete all required fields.', true);
        return;
      }

      if (user.toLowerCase() === 'admin') {
        showAlert('"admin" is the default primary account. Use Sign In with password 123.', true);
        return;
      }

      let customUsers = [];
      try {
        customUsers = JSON.parse(localStorage.getItem(USERS_STORAGE_KEY) || '[]');
      } catch (err) {
        customUsers = [];
      }

      if (customUsers.some(u => u.username.toLowerCase() === user.toLowerCase())) {
        showAlert(`Username "${user}" already exists. Please choose another username.`, true);
        return;
      }

      const newAccount = {
        name: fullName,
        username: user,
        password: pass,
        role: role,
        createdAt: new Date().toISOString()
      };

      customUsers.push(newAccount);
      localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(customUsers));

      // Auto login
      sessionStorage.setItem('urbanshine_admin_authenticated', 'true');
      sessionStorage.setItem('urbanshine_admin_user', JSON.stringify(newAccount));
      localStorage.setItem('urbanshine_admin_authenticated', 'true');
      localStorage.setItem('urbanshine_admin_user', JSON.stringify(newAccount));

      showAlert(`Admin account "${user}" created! Redirecting to dashboard...`, false);
      setTimeout(() => {
        window.location.replace('/admin');
      }, 500);
    }
  </script>
</body>
</html>
